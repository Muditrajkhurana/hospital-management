<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment</title>
    <link rel="icon" href="images/icon-logo.png" type="image/x-icon"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="apointment.css">
</head>
<body>
    <div class="wraper">
        <div class="nav-bar">
            <div class="nav-brand">
                <img src="images/logo.png" alt="" height="70">
                <h3>Patient Path & Care</h3></div>
            <ul class=" mb-0 nav-item">
                <li><a href="index.html" class="home">Home</a></li>
                <li><a href="index.html">Times</a></li>
                <li><a href="index.html">About Us</a></li>
                <li><a href="index.html">services</a></li>
                <li><a href="#">Doctor</a></li>
                <li><a href="feedback.html" target="_blank">Feedback</a></li>
            </ul>
            <button data-toggle="modal" data-target="#myModal"><i class="fa-2x"><i class="fa-solid fa-user"></i></i></button>
        </div>
        <h3 id="total"></h3>
        <div class="c">
            <h5>Name</h5>
            <h5>Phone No </h5>
            <h5>Gender</h5>
            <h5>Date</h5>
            <h5>Time</h5>
            <h5>Doctor</h5>
            <h5>Reason</h5>
            <h5>Cansel</h5>
        </div>
        <div class="main" id="note">
            
        </div>
    </div>
    <script src="https://kit.fontawesome.com/71e935b421.js" crossorigin="anonymous"></script>
      <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
      <script>
        let ans = JSON.parse(localStorage.getItem('notes')) || [];
        let note = document.getElementById('note');
        view();
    
        function view() {
            ans.sort((a, b) => new Date(a.date) - new Date(b.date));
            note.innerHTML="";
            // Iterate over notes and create elements
            for (let i = 0; i < ans.length; i++) {
                let date = new Date(ans[i].date);
                let today = new Date();
                today.setHours(0, 0, 0, 0);
                if(date>=today){
                    const tablerow = document.createElement("div");
                const fields = ['name',  'phoneno','gender', 'date', 'time', 'doctor', 'reason'];
    
                // Create paragraph elements for each field
                fields.forEach(field => {
                    const p = document.createElement("h5");
                    p.innerHTML = ans[i][field];
                    tablerow.appendChild(p);
                });
    
                // Create delete button
                let deleteBtn = document.createElement("div");
                deleteBtn.innerText = "Cancle";
                deleteBtn.onclick = function () {
                    notedelete(i);
                };
                tablerow.appendChild(deleteBtn);
                note.appendChild(tablerow);
                }
            }
            document.getElementById('total').innerHTML=`Total Appointments (${ans.length}) `
        }
    
        function notedelete(i) {
            ans.splice(i, 1);
            localStorage.setItem('notes', JSON.stringify(ans));
            view();
        }
    </script>
</body>
</html>
